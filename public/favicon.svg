<!--
  The title's O: one corner-on voxel.

  Same silhouette the wordmark draws — yawed 45 degrees, tilted about 20
  degrees above the horizon, three faces lit differently, outline and internal
  edges in the beam colour. At sixteen pixels the spectrum cube was mush; this
  shape is the board's own cell and the letter that stands for the game, and it
  stays legible when half the pixels are the stroke.

  Geometry copied from the wordmark SVG in screens.ts. Ground is the same
  near-black the HUD panels use; stroke and fills are accent-beam cyan.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Refraction">
  <rect width="32" height="32" rx="7" fill="#0a0c14" />
  <g transform="translate(4 4) scale(0.24)" fill="none">
    <path d="M50 3 L96.6 19.1 L50 35.2 L3.4 19.1 Z" fill="#57daff" fill-opacity="0.2" />
    <path d="M3.4 19.1 L50 35.2 L50 97 L3.4 80.9 Z" fill="#57daff" fill-opacity="0.1" />
    <path d="M50 35.2 L96.6 19.1 L96.6 80.9 L50 97 Z" fill="#57daff" fill-opacity="0.075" />
    <g stroke="#57daff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 3 L96.6 19.1 L96.6 80.9 L50 97 L3.4 80.9 L3.4 19.1 Z" />
      <path d="M3.4 19.1 L50 35.2 L96.6 19.1 M50 35.2 L50 97" />
    </g>
  </g>
</svg>
