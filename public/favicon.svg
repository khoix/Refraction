<!--
  One voxel, wearing the whole ramp.

  The mark has to say the game's rule at sixteen pixels, and the rule is that
  colour is distance: red near, violet far. Concentric rings would say it more
  literally -- the well seen head on -- but seven rings inside a 16px square is
  about one pixel each, which is mush. A single rounded cube swept from red to
  violet keeps both halves of the idea legible at any size: the shape is the
  board's own voxel, and the sweep is the spectrum it reads depth from.

  The seven stops are the palette's own bands, taken from `depthColor` at each
  seventh, not colours picked to look like a rainbow. The ground is the same
  near-black the HUD panels use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Refraction">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eb493f" />
      <stop offset="0.167" stop-color="#fd8a02" />
      <stop offset="0.333" stop-color="#f9d332" />
      <stop offset="0.5" stop-color="#5eda80" />
      <stop offset="0.667" stop-color="#4495ea" />
      <stop offset="0.833" stop-color="#6d50cd" />
      <stop offset="1" stop-color="#9521a6" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0a0c14" />
  <rect x="4" y="4" width="24" height="24" rx="5" fill="url(#spectrum)" />
</svg>
